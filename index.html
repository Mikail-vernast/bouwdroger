<!doctype html>
<html lang="nl-BE">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Hier staan bewust géén title, description, canonical of OG-tags. Die zet
      elke route zelf via src/components/PageMeta.tsx en ze worden bij de build
      in de HTML van die route geprerenderd (vite-react-ssg). Zou hier ook een
      title staan, dan kreeg elke pagina er twee.
    -->
    <meta name="theme-color" content="#6E1212" />
    <link rel="icon" href="/favicon.ico" sizes="any" />

    <!--
      De fonts komen van onze eigen origin (public/fonts, aangeroepen vanuit
      src/styles/fonts.css). Daarom staat hier geen preconnect meer naar
      Google: er valt geen verbinding met een derde partij vooruit te leggen.

      Wel worden de twee die bóven de vouw staan vooruit opgehaald. Ze worden
      pas ontdekt wanneer de browser de CSS heeft gelezen, en die CSS blokkeert
      zelf al het renderen — de titel kwam daardoor eerst in het systeemfont op
      het scherm en wisselde daarna alsnog. Die tweede tekening telt als nieuwe
      LCP, dus de meting bleef hangen op ruim drie seconden terwijl er allang
      iets stond.

      Alleen deze twee: 'Plus Jakarta Sans' is de titel, 'DM Sans' de lopende
      tekst. De -ext-varianten dekken tekens die in het Nederlands nauwelijks
      voorkomen en mogen gewoon later komen; alles vooruit halen zou de bandbreedte
      juist wegnemen bij wat wél nodig is.
    -->
    <link
      rel="preload"
      href="/fonts/plus-jakarta-sans-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="preload" href="/fonts/dm-sans-latin.woff2" as="font" type="font/woff2" crossorigin />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
