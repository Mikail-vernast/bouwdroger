<!doctype html>
<html lang="nl-BE">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Hier staan bewust géén title, description, canonical of OG-tags. Die zet
      elke route zelf via src/components/PageMeta.tsx en ze worden bij de build
      in de HTML van die route geprerenderd (vite-react-ssg). Zou hier ook een
      title staan, dan kreeg elke pagina er twee.
    -->
    <meta name="theme-color" content="#6E1212" />
    <link rel="icon" href="/favicon.ico" sizes="any" />

    <!--
      De fonts komen van onze eigen origin (public/fonts, aangeroepen vanuit
      src/styles/fonts.css). Daarom staat hier geen preconnect meer naar
      Google: er valt geen verbinding met een derde partij vooruit te leggen.

      Hier stond ook een preload voor 'Plus Jakarta Sans' en 'DM Sans'. Dat
      klopte voor de homepage, maar dit bestand is de schil van élke route, en
      de inhoudspagina's zetten hun body en titels op Inter. Die kregen dus
      63 kB font vooruit dat niets tekent, terwijl Inter zelf pas ná de titel
      binnenkwam. Welk font vooruit gehaald wordt hangt dus af van de pagina;
      dat regelt src/components/FontPreload.tsx, aangeroepen vanuit de twee
      schillen.
    -->
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
